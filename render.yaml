# Render Blueprint -- provisions the backend, its Postgres database, and its
# Key Value (Redis) instance together from one file. Deploy via Render's
# dashboard: New -> Blueprint -> connect this repo. See README.md's
# Deployment section for the full walkthrough.
#
# No dockerCommand override here -- Render's dockerCommand field doesn't
# shell-parse a compound `a && b` command the way a Dockerfile CMD does (it
# was passed through literally and failed with "not found" on the whole
# string). The image's own CMD (server/docker-entrypoint.sh: migrate, then
# start) runs migrations before every boot instead -- drizzle's migrator
# tracks applied migrations and no-ops on ones already run, so repeating it
# on every restart is safe.
databases:
  - name: urbancart-postgres
    plan: free
    region: oregon

services:
  - name: urbancart-redis
    type: keyvalue
    plan: free
    region: oregon
    ipAllowList: [] # private network only -- no public internet access

  - name: urbancart-backend
    type: web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: urbancart-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: urbancart-redis
          type: keyvalue
          property: connectionString
      # Secrets and deployment-specific values -- Render prompts for these
      # during Blueprint creation rather than storing them in this file.
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Wherever the frontend ends up deployed -- see README.md.
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_SAME_SITE
        value: none # frontend and backend are on different Render/host domains
