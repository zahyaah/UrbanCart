# Render Blueprint -- provisions the backend and its Key Value (Redis)
# instance. Postgres is Neon (Render's free Postgres expires); its connection
# strings are set in the Render dashboard, never in this file. Deploy via Render's
# dashboard: New -> Blueprint -> connect this repo. See README.md's
# Deployment section for the full walkthrough.
#
# No dockerCommand override here -- Render's dockerCommand field doesn't
# shell-parse a compound `a && b` command the way a Dockerfile CMD does (it
# was passed through literally and failed with "not found" on the whole
# string). The image's own CMD (server/docker-entrypoint.sh: migrate, then
# start) runs migrations before every boot instead -- drizzle's migrator
# tracks applied migrations and no-ops on ones already run, so repeating it
# on every restart is safe.
services:
  - name: urbancart-redis
    type: keyvalue
    plan: free
    region: oregon
    ipAllowList: [] # private network only -- no public internet access

  - name: urbancart-backend
    type: web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Neon, set in the dashboard. DATABASE_URL: the POOLED string (host
      # ends in "-pooler") for app traffic. DATABASE_URL_UNPOOLED: the
      # DIRECT string, which boot-time migrations use (server/src/db/
      # migrate.ts). Both keep Neon's ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: REDIS_URL
        fromService:
          name: urbancart-redis
          type: keyvalue
          property: connectionString
      # Secrets and deployment-specific values -- Render prompts for these
      # during Blueprint creation rather than storing them in this file.
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Wherever the frontend ends up deployed -- see README.md.
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      # The frontend calls this API through its own host's /api rewrite
      # (vercel.json), so auth cookies are first-party: SameSite=Lax works,
      # and nothing depends on third-party cookies, which Safari/Brave/
      # incognito block. The browser sees /api/auth/..., hence the prefix.
      - key: COOKIE_SAME_SITE
        value: lax
      - key: COOKIE_PATH_PREFIX
        value: /api
      # Proxies to trust when resolving the client IP (the rate-limit key).
      # Chain verified in prod from the "login client address" log line:
      # client -> Vercel -> Cloudflare -> Render internal -> this service.
      - key: TRUST_PROXY_HOPS
        value: "4"
