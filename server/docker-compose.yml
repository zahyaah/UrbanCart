services:
  postgres:
    image: postgres:16-alpine
    container_name: urbancart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: urbancart
      POSTGRES_PASSWORD: urbancart_dev_only
      POSTGRES_DB: urbancart
    ports:
      - "5433:5432"
    volumes:
      - urbancart-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbancart -d urbancart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  urbancart-postgres-data:
