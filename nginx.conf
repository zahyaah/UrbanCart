server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: any path that isn't a real file falls back to index.html so
    # react-router's client-side routes (e.g. a hard refresh on /checkout)
    # don't 404 at the web server.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames (Vite's default) are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
