name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # Lint, typecheck, unit tests and build run as one job: each takes seconds,
  # so separate jobs would spend more time on checkout and npm ci than on work.
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build

  backend:
    name: Backend (lint, typecheck, tests)
    runs-on: ubuntu-latest
    # Service containers matching server/.env.test exactly (same host ports,
    # same credentials, same DB name) -- so the committed .env.test needs no
    # CI-specific override, and a contributor's local Postgres/Redis (from
    # docker-compose.yml, same 5433/6379 ports) exercises the identical
    # config a CI run does.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: urbancart
          POSTGRES_PASSWORD: urbancart_dev_only
          POSTGRES_DB: urbancart_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U urbancart -d urbancart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run migrations against the test database
        # Not `npm run db:migrate` -- that script hardcodes --env-file=.env,
        # which doesn't exist in CI (only .env.example is committed). Runs
        # the same underlying script directly, reading DATABASE_URL from
        # real process env instead.
        run: npx tsx src/db/migrate.ts
        env:
          DATABASE_URL: postgres://urbancart:urbancart_dev_only@localhost:5433/urbancart_test

      - name: Unit + integration tests
        # server/.env.test (committed) supplies every other var -- see the
        # services: block above for why its hardcoded ports need no override.
        run: npm test

      - name: Build
        run: npm run build

  # Currently red, tracked rather than hidden: the suite predates Phase C's
  # backend rewrite (expects a 4-step wizard with a removed "Review" step,
  # mock card validation replaced by real Stripe Elements, no auth gate on
  # checkout). See README.md's Testing section. continue-on-error keeps this
  # visible without blocking every unrelated PR on a known, pre-existing gap
  # -- same pattern as the audit job below.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Browsers are ~200 MB; key the cache on the resolved Playwright version
      # so a dependency bump fetches matching binaries instead of stale ones.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # System dependencies live outside the cached browser directory, so they
      # still have to be installed on a cache hit.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.config.js builds the app and serves it via `vite preview`,
      # so the suite runs against the production bundle, not the dev server.
      - name: Run Playwright suite
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Reported, not enforced. The current high-severity advisories are all
  # transitive dev-tooling issues whose fixes require major-version bumps of
  # vite and react-router-dom; that upgrade is tracked separately rather than
  # left to block every unrelated pull request.
  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
